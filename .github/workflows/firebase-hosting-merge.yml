# This file configures live Firebase Hosting deploys on pushes to main.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - ".nojekyll"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "data/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-pull-request.yml"
      - ".github/workflows/firebase-hosting-merge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QURAN_READER }}
          projectId: quran-reader-live
          channelId: live
          target: quran
          # 15.35.0 first asks the Service Usage API whether Hosting is enabled, which this
          # deploy key may not do (403 on serviceusage.services.get); 15.34.0 deploys.
          # Back to latest once the key has the Service Usage Consumer role.
          firebaseToolsVersion: "15.34.0"
